<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jungle Math</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jungle Math">
<meta name="theme-color" content="#1d3b1b">
<link rel="apple-touch-icon" href="img/icon_180.png">
<link rel="icon" href="img/icon_180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="backdrop"></div>
<main id="stage">
  <img id="bg" alt="">
  <button id="toucan" class="plain" aria-label="Toucan"><img src="img/toucan.webp" alt=""></button>
  <img id="hang" src="img/friend_hang.webp" alt="">

  <div id="score"><img src="img/badge.webp" alt=""><span id="count">0</span></div>
  <div id="plus">+1</div>
  <div id="leaves" aria-label="Lucky leaves"></div>
  <div id="track" class="off">
    <img id="branch" src="img/branch.webp" alt="">
    <img id="trackBanana" src="img/banana.webp" alt="">
    <div id="runner"><img id="runnerPose" src="img/toucan_hop.webp" alt="Hungry toucan"></div>
  </div>

  <div id="sign">
    <i class="rope l"></i><i class="rope r"></i>
    <img src="img/banner.webp" alt="">
    <div id="problem" aria-live="polite"></div>
    <div id="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  </div>

  <div id="progress" aria-label="Level progress">
    <div id="segments"></div>
    <img src="img/bar_frame.webp" alt="">
  </div>
  <button id="pause" class="plain" aria-label="Pause"><img src="img/btn_pause.webp" alt=""></button>

  <div id="rays"></div>
  <div class="side" id="sideL"></div>
  <div class="side" id="sideR"></div>
  <div id="pack"></div>
  <div id="tiles"></div>
  <img id="monkey" src="img/monkey_think.webp" alt="Monkey">
  <div id="fx"></div>

  <section id="start" class="overlay">
    <img class="title-monkey" src="img/monkey_happy.webp" alt="">
    <div class="board"><img src="img/banner.webp" alt=""><h1>Jungle Math</h1></div>
    <button id="play" class="wood" disabled>Loading…</button>
    <div class="menuRow">
      <button class="wood small chooseLevel">Start from level</button>
      <button class="wood small startOver" hidden>Start over</button>
    </div>
  </section>

  <section id="paused" class="overlay" hidden>
    <div class="board"><img src="img/banner.webp" alt=""><h2>Paused</h2></div>
    <button id="resume" class="wood">Keep playing</button>
    <div class="menuGrid">
      <button id="toggleMusic" class="wood small"></button>
      <button id="toggleSfx" class="wood small"></button>
      <button id="toggleVoice" class="wood small"></button>
      <button id="toggleRelaxed" class="wood small"></button>
      <button id="toggleFast" class="wood small"></button>
      <button class="wood small chooseLevel">Start from level</button>
      <button class="wood small startOver wide">Start over</button>
    </div>
  </section>

  <section id="levelPicker" class="overlay" hidden>
    <div class="board"><img src="img/banner.webp" alt=""><h2>Pick a level</h2></div>
    <div id="levelGrid"></div>
    <button id="pickerBack" class="wood small">Back</button>
  </section>

  <section id="nap" class="overlay" hidden>
    <img class="nap-monkey" src="img/monkey_nap.webp" alt="The monkey is napping">
    <div class="board"><img src="img/banner.webp" alt=""><h2>Nap time!</h2></div>
    <p class="nap-text">Let's try that again!</p>
    <button id="wakeUp" class="wood">Wake up!</button>
  </section>

  <section id="levelup" class="overlay" hidden>
    <img class="friend l" src="img/friend_jump.webp" alt="">
    <img class="friend r" src="img/friend_jump.webp" alt="">
    <img class="title-monkey" src="img/monkey_happy.webp" alt="">
    <div class="board"><img src="img/banner.webp" alt=""><h2 id="levelText"></h2></div>
    <button id="nextLevel" class="wood">Next level</button>
  </section>
</main>
<div id="rotate"><img src="img/monkey_oops.webp" alt=""><p>Please turn your iPad sideways</p></div>
<script src="sounds.js"></script>
<script src="game.js"></script>
</body>
</html>
